<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="kenBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dcfce7"/>
      <stop offset="100%" stop-color="#bbf7d0"/>
    </linearGradient>
    <linearGradient id="kenCan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14532d"/>
      <stop offset="30%" stop-color="#16a34a"/>
      <stop offset="65%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#052e16"/>
    </linearGradient>
    <filter id="shadow11" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="200" height="200" rx="20" fill="url(#kenBg)"/>
  <!-- 18+ Corner Badge -->
  <rect x="150" y="14" width="36" height="20" rx="5" fill="#dc2626"/>
  <text x="168" y="28" text-anchor="middle" font-family="'Arial Black', sans-serif" font-size="10" font-weight="900" fill="#ffffff">18+</text>

  <g filter="url(#shadow11)">
    <!-- Can Rim Top (Silver) -->
    <ellipse cx="100" cy="40" rx="26" ry="6" fill="#e2e8f0"/>
    <ellipse cx="100" cy="38" rx="20" ry="4.5" fill="#94a3b8"/>
    <!-- Sleek Can Body -->
    <path d="M74,40 L74,152 Q74,166 100,166 Q126,166 126,152 L126,40 Z" fill="url(#kenCan)"/>
    <!-- Famous Red Star -->
    <polygon points="100,56 103,66 113,66 105,72 108,82 100,76 92,82 95,72 87,66 97,66" fill="#ef4444"/>
    <!-- White Oval Banner -->
    <ellipse cx="100" cy="105" rx="24" ry="16" fill="#ffffff"/>
    <text x="100" y="108" text-anchor="middle" font-family="'Arial Black', sans-serif" font-size="7.5" font-weight="900" fill="#14532d">Heineken</text>
    <path d="M74,124 Q100,132 126,124" stroke="#ffffff" stroke-width="2" fill="none"/>
    <text x="100" y="146" text-anchor="middle" font-family="sans-serif" font-size="7" font-weight="800" fill="#ffffff" letter-spacing="1">ORIGINAL</text>
  </g>
</svg>