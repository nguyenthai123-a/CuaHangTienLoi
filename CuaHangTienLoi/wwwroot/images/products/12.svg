<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="cravBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fee2e2"/>
      <stop offset="100%" stop-color="#fecaca"/>
    </linearGradient>
    <linearGradient id="packGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#991b1b"/>
      <stop offset="40%" stop-color="#dc2626"/>
      <stop offset="80%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <filter id="shadow12" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="200" height="200" rx="20" fill="url(#cravBg)"/>
  <!-- 18+ Corner Badge -->
  <rect x="150" y="14" width="36" height="20" rx="5" fill="#dc2626"/>
  <text x="168" y="28" text-anchor="middle" font-family="'Arial Black', sans-serif" font-size="10" font-weight="900" fill="#ffffff">18+</text>

  <g filter="url(#shadow12)">
    <!-- Cigarette Flip Top Box -->
    <rect x="66" y="45" width="68" height="110" rx="5" fill="url(#packGrad)"/>
    <!-- Lid Cut Line -->
    <line x1="66" y1="72" x2="134" y2="72" stroke="#450a0a" stroke-width="1.5"/>
    <!-- Iconic Red Cat Roundel -->
    <circle cx="100" cy="100" r="18" fill="#ffffff"/>
    <circle cx="100" cy="100" r="16" fill="#18181b"/>
    <!-- Cat head outline in gold -->
    <path d="M92,104 L90,92 L95,96 L105,96 L110,92 L108,104 Z" fill="#eab308"/>
    <!-- Brand Name -->
    <text x="100" y="65" text-anchor="middle" font-family="'Times New Roman', serif" font-size="12" font-weight="bold" fill="#ffffff" letter-spacing="1">CRAVEN</text>
    <text x="100" y="132" text-anchor="middle" font-family="'Arial Black', sans-serif" font-size="16" font-weight="900" fill="#facc15">"A"</text>
    <!-- Gold Border Accent -->
    <rect x="70" y="49" width="60" height="102" rx="3" fill="none" stroke="#facc15" stroke-width="0.8" opacity="0.6"/>
  </g>
</svg>