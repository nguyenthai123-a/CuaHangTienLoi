<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="teaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dcfce7"/>
      <stop offset="100%" stop-color="#bbf7d0"/>
    </linearGradient>
    <linearGradient id="teaBottle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="30%" stop-color="#22c55e"/>
      <stop offset="70%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <linearGradient id="teaLiquid" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ca8a04"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="200" height="200" rx="20" fill="url(#teaBg)"/>
  <g filter="url(#shadow2)">
    <!-- Bottle Cap (Gold) -->
    <rect x="91" y="25" width="18" height="12" rx="2" fill="#eab308"/>
    <!-- Bottle Neck -->
    <path d="M94,37 L106,37 L110,65 L90,65 Z" fill="#86efac" opacity="0.85"/>
    <!-- Main Bottle Body -->
    <path d="M90,65 Q70,75 72,110 L75,160 Q75,170 100,170 Q125,170 125,160 L128,110 Q130,75 110,65 Z" fill="url(#teaBottle)"/>
    <!-- Label -->
    <rect x="73" y="95" width="54" height="42" rx="4" fill="#ffffff" opacity="0.95"/>
    <!-- Tea Leaf Icon -->
    <path d="M100,102 Q112,106 108,118 Q100,120 95,115 Q92,106 100,102 Z" fill="#16a34a"/>
    <path d="M98,115 Q102,110 106,106" stroke="#ffffff" stroke-width="1.5" fill="none"/>
    <text x="100" y="126" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="900" fill="#15803d">TRÀ XANH</text>
    <text x="100" y="133" text-anchor="middle" font-family="sans-serif" font-size="6" font-weight="700" fill="#dc2626">KHÔNG ĐỘ</text>
  </g>
  <!-- Floating Leaves -->
  <path d="M50,70 Q60,72 58,82 Q50,85 45,80 Z" fill="#22c55e" opacity="0.7"/>
  <path d="M150,130 Q160,133 156,143 Q147,144 145,138 Z" fill="#22c55e" opacity="0.6"/>
</svg>