<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="tigerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="tigerCan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="30%" stop-color="#2563eb"/>
      <stop offset="65%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="goldBanner" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ca8a04"/>
      <stop offset="50%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <filter id="shadow10" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="200" height="200" rx="20" fill="url(#tigerBg)"/>
  <!-- 18+ Corner Badge -->
  <rect x="150" y="14" width="36" height="20" rx="5" fill="#dc2626"/>
  <text x="168" y="28" text-anchor="middle" font-family="'Arial Black', sans-serif" font-size="10" font-weight="900" fill="#ffffff">18+</text>

  <g filter="url(#shadow10)">
    <!-- Can Rim Top -->
    <ellipse cx="100" cy="42" rx="28" ry="7" fill="#cbd5e1"/>
    <ellipse cx="100" cy="40" rx="22" ry="5" fill="#94a3b8"/>
    <!-- Can Body -->
    <path d="M72,42 L72,150 Q72,165 100,165 Q128,165 128,150 L128,42 Z" fill="url(#tigerCan)"/>
    <!-- Gold Medallion & Tiger -->
    <circle cx="100" cy="80" r="22" fill="url(#goldBanner)"/>
    <!-- Tiger Silhouette (Stylized) -->
    <path d="M90,75 Q100,68 110,75 Q114,84 100,88 Q86,84 90,75 Z" fill="#1e3a8a"/>
    <!-- Blue Ribbon with TIGER -->
    <rect x="68" y="105" width="64" height="24" rx="3" fill="#ffffff"/>
    <text x="100" y="122" text-anchor="middle" font-family="'Arial Black', sans-serif" font-size="14" font-weight="900" fill="#1e3a8a" letter-spacing="1">Tiger</text>
    <text x="100" y="145" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="800" fill="#fde047" letter-spacing="0.5">LAGER BEER</text>
  </g>
</svg>