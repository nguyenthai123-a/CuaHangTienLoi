<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="cokeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fee2e2"/>
      <stop offset="100%" stop-color="#fecaca"/>
    </linearGradient>
    <linearGradient id="cokeCan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="25%" stop-color="#ef4444"/>
      <stop offset="60%" stop-color="#dc2626"/>
      <stop offset="90%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <linearGradient id="silverRim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="200" height="200" rx="20" fill="url(#cokeBg)"/>
  <!-- Coke Sleek Can -->
  <g filter="url(#shadow)">
    <!-- Can Rim Top -->
    <ellipse cx="100" cy="40" rx="28" ry="7" fill="url(#silverRim)"/>
    <ellipse cx="100" cy="38" rx="22" ry="5" fill="#cbd5e1"/>
    <!-- Pull Tab -->
    <ellipse cx="100" cy="38" rx="7" ry="2.5" fill="#64748b"/>
    <!-- Can Body -->
    <path d="M72,40 Q70,55 70,65 L70,150 Q70,165 100,165 Q130,165 130,150 L130,65 Q130,55 128,40 Z" fill="url(#cokeCan)"/>
    <!-- Can Rim Bottom -->
    <ellipse cx="100" cy="150" rx="30" ry="6" fill="url(#silverRim)"/>
    <!-- Dynamic Ribbon / Wave -->
    <path d="M70,95 Q100,80 130,105 L130,120 Q100,95 70,110 Z" fill="#ffffff" opacity="0.95"/>
    <path d="M70,105 Q100,90 130,115 L130,119 Q100,95 70,109 Z" fill="#ffffff" opacity="0.4"/>
    <!-- Coca-Cola Text simulation -->
    <text x="100" y="85" text-anchor="middle" font-family="'Brush Script MT', cursive, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" letter-spacing="1">Coca-Cola</text>
    <text x="100" y="140" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#ffffff" opacity="0.85">ORIGINAL</text>
  </g>
  <!-- Sparkles -->
  <circle cx="55" cy="50" r="3" fill="#ffffff" opacity="0.8"/>
  <circle cx="145" cy="70" r="2" fill="#ffffff" opacity="0.7"/>
</svg>