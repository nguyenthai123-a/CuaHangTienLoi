<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="breadBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="crustGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="crumbGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <filter id="shadow6" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="200" height="200" rx="20" fill="url(#breadBg)"/>
  <g filter="url(#shadow6)">
    <!-- Back Toast Slice -->
    <path d="M58,55 Q50,45 65,42 Q100,38 135,42 Q150,45 142,55 L144,142 Q144,152 100,152 Q56,152 56,142 Z" fill="#b45309"/>
    <!-- Front Toast Slice -->
    <path d="M50,65 Q42,53 60,50 Q100,45 140,50 Q158,53 150,65 L152,150 Q152,160 100,160 Q48,160 48,150 Z" fill="url(#crustGrad)"/>
    <path d="M56,70 Q50,60 65,58 Q100,53 135,58 Q150,60 144,70 L146,144 Q146,152 100,152 Q54,152 54,144 Z" fill="url(#crumbGrad)"/>
    <!-- Butter pat on toast -->
    <rect x="88" y="90" width="24" height="24" rx="4" fill="#fde047" stroke="#eab308" stroke-width="1.5" transform="rotate(15 100 102)"/>
    <!-- Melt droplet -->
    <circle cx="118" cy="115" r="3.5" fill="#fde047"/>
    <!-- Kinh Do Red Ribbon -->
    <rect x="42" y="112" width="116" height="26" rx="4" fill="#dc2626"/>
    <text x="100" y="125" text-anchor="middle" font-family="'Arial Black', sans-serif" font-size="9" font-weight="900" fill="#ffffff">KINH ĐÔ</text>
    <text x="100" y="133" text-anchor="middle" font-family="sans-serif" font-size="6.5" font-weight="700" fill="#fef08a">SANDWICH BƠ SỮA</text>
  </g>
</svg>