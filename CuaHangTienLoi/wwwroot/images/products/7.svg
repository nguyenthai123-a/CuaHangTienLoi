<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="milkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="cartonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <filter id="shadow7" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="200" height="200" rx="20" fill="url(#milkBg)"/>
  <g filter="url(#shadow7)">
    <!-- Tetra Pak Gable Top -->
    <polygon points="68,55 100,32 132,55" fill="#93c5fd"/>
    <polygon points="68,55 100,42 100,32" fill="#60a5fa"/>
    <!-- Straw hole -->
    <circle cx="116" cy="48" r="3.5" fill="#cbd5e1" stroke="#94a3b8"/>
    <!-- Carton Box Body -->
    <rect x="68" y="55" width="64" height="105" rx="4" fill="url(#cartonGrad)"/>
    <!-- White milk wave -->
    <path d="M68,105 Q100,88 132,105 L132,160 L68,160 Z" fill="#ffffff"/>
    <!-- Vinamilk Brand Logo -->
    <ellipse cx="100" cy="74" rx="26" ry="10" fill="#1e3a8a"/>
    <text x="100" y="78" text-anchor="middle" font-family="'Arial Black', sans-serif" font-size="8.5" font-weight="900" fill="#ffffff" letter-spacing="0.5">VINAMILK</text>
    <!-- 100% Sữa tươi text -->
    <text x="100" y="93" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="900" fill="#fbbf24">100%</text>
    <text x="100" y="126" text-anchor="middle" font-family="sans-serif" font-size="7" font-weight="800" fill="#1e40af">SỮA TƯƠI</text>
    <text x="100" y="137" text-anchor="middle" font-family="sans-serif" font-size="6" font-weight="600" fill="#64748b">TIỆT TRÙNG 180ml</text>
    <rect x="85" y="142" width="30" height="9" rx="2" fill="#3b82f6"/>
    <text x="100" y="149" text-anchor="middle" font-family="sans-serif" font-size="5.5" font-weight="700" fill="#ffffff">ÍT ĐƯỜNG</text>
  </g>
</svg>