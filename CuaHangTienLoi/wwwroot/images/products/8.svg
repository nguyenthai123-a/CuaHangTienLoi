<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="yogBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfeff"/>
      <stop offset="100%" stop-color="#cffafe"/>
    </linearGradient>
    <linearGradient id="cupGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="shadow8" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="200" height="200" rx="20" fill="url(#yogBg)"/>
  <g filter="url(#shadow8)">
    <!-- Back Cup 1 -->
    <path d="M52,65 L60,110 L90,110 L98,65 Z" fill="#93c5fd" opacity="0.6"/>
    <ellipse cx="75" cy="65" rx="23" ry="5" fill="#60a5fa"/>

    <!-- Back Cup 2 -->
    <path d="M102,65 L110,110 L140,110 L148,65 Z" fill="#93c5fd" opacity="0.6"/>
    <ellipse cx="125" cy="65" rx="23" ry="5" fill="#60a5fa"/>

    <!-- Front Cup 1 -->
    <path d="M48,85 L58,145 Q58,155 80,155 Q102,155 102,145 L112,85 Z" fill="url(#cupGrad)"/>
    <ellipse cx="80" cy="85" rx="32" ry="7" fill="#ffffff" stroke="#38bdf8" stroke-width="2"/>
    <text x="80" y="88" text-anchor="middle" font-family="'Arial Black', sans-serif" font-size="6" font-weight="900" fill="#0284c7">VINAMILK</text>
    <text x="80" y="118" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="800" fill="#ffffff">SỮA CHUA</text>
    <text x="80" y="128" text-anchor="middle" font-family="sans-serif" font-size="6" font-weight="600" fill="#fef08a">CÓ ĐƯỜNG</text>

    <!-- Front Cup 2 -->
    <path d="M98,85 L108,145 Q108,155 130,155 Q152,155 152,145 L162,85 Z" fill="url(#cupGrad)"/>
    <ellipse cx="130" cy="85" rx="32" ry="7" fill="#ffffff" stroke="#38bdf8" stroke-width="2"/>
    <text x="130" y="88" text-anchor="middle" font-family="'Arial Black', sans-serif" font-size="6" font-weight="900" fill="#0284c7">VINAMILK</text>
    <text x="130" y="118" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="800" fill="#ffffff">SỮA CHUA</text>
    <text x="130" y="128" text-anchor="middle" font-family="sans-serif" font-size="6" font-weight="600" fill="#fef08a">LỐC 4 HỘP</text>
  </g>
</svg>