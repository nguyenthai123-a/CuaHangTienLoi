# =========================================================================================
# Cấu hình Nginx Reverse Proxy cho Hệ thống Cửa Hàng Tiện Lợi (CuaHangTienLoi)
# Hỗ trợ HTTPS, bảo vệ Header, Giới hạn tần suất (Rate Limiting), Nén Gzip và Proxy WebSockets
# =========================================================================================

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush     on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens off; # Ẩn phiên bản Nginx để tăng cường bảo mật

    # Nén Gzip tối ưu truyền tải mạng
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Rate limiting: giới hạn 20 yêu cầu / giây trên mỗi IP
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

    # Cụm upstream ứng dụng ASP.NET Core MVC (Kestrel)
    upstream cuahang_backend {
        server 127.0.0.1:5000;
        keepalive 32;
    }

    # 1. Chuyển hướng toàn bộ HTTP (Port 80) sang HTTPS (Port 443)
    server {
        listen 80;
        listen [::]:80;
        server_name cuahangtienloi.local www.cuahangtienloi.local;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # 2. Cấu hình HTTPS an toàn (Port 443)
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name cuahangtienloi.local www.cuahangtienloi.local;

        # Chứng chỉ SSL/TLS
        ssl_certificate     /etc/ssl/certs/cuahangtienloi.crt;
        ssl_certificate_key /etc/ssl/private/cuahangtienloi.key;

        # Giao thức SSL & Cipher suite bảo mật cao
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Các HTTP Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; img-src 'self' data: https:;" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Giới hạn kích thước tải tệp lên (Excel danh mục...)
        client_max_body_size 25M;

        # Static files caching
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg)$ {
            proxy_pass http://cuahang_backend;
            proxy_cache_valid 200 302 30d;
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }

        # Chuyển tiếp tới backend Kestrel
        location / {
            limit_req zone=api_limit burst=50 nodelay;

            proxy_pass         http://cuahang_backend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection keep-alive;
            proxy_set_header   Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Real-IP $remote_addr;

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
        }
    }
}
